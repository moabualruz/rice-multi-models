name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Bind native plugin test prerequisite
        shell: bash
        run: |
          df -Pk "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/claude-native" --cache "$RUNNER_TEMP/npm-cache" --ignore-scripts=false --no-audit --no-fund @anthropic-ai/claude-code@2.1.299
          claude_bin="$RUNNER_TEMP/claude-native/node_modules/.bin/claude"
          test "$("$claude_bin" --version)" = '2.1.299 (Claude Code)'
          printf '%s\n' "${claude_bin%/*}" >> "$GITHUB_PATH"
      - run: bun run check
      - name: Reject typographic dashes in changed lines
        shell: bash
        run: |
          git diff --unified=0 HEAD^ HEAD -- '*.ts' '*.json' '*.md' '*.yml' > patch.txt
          if grep '^+' patch.txt | grep -v '^+++' | grep -P '\x{2013}|\x{2014}'; then
            exit 1
          fi
          rm patch.txt
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bind official native Windows prerequisite
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Name, Free, Used
          $nativePrefix = Join-Path $env:RUNNER_TEMP 'claude-native'
          npm install --prefix $nativePrefix --ignore-scripts=false --no-audit --no-fund '@anthropic-ai/claude-code@2.1.299'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativeExecutable = Join-Path $nativePrefix 'node_modules/@anthropic-ai/claude-code/bin/claude.exe'
          $version = & $nativeExecutable --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '2.1.299 (Claude Code)') { throw 'Native prerequisite unavailable' }
          "RICE_CLAUDE_EXECUTABLE=$nativeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run build:check
      - name: Check private native Windows bootstrap
        shell: pwsh
        run: |
          node --input-type=module -e "import {build} from 'esbuild'; await build({entryPoints:['helper/native/windows-bootstrap.ts'],outfile:process.env.RUNNER_TEMP+'/windows-bootstrap.mjs',bundle:true,platform:'node',target:'node22',format:'esm'});"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/proof-windows-bootstrap.mjs "$env:RUNNER_TEMP/windows-bootstrap.mjs"
      - run: node scripts/proof-windows-native-launcher.mjs
      - run: node scripts/proof-native-adapter.mjs protocols
      - run: npm run test:search
